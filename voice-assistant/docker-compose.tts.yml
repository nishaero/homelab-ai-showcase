services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro-tts
    restart: unless-stopped
  wyoming-kokoro:
    image: ghcr.io/roryeckel/wyoming_openai:latest
    container_name: wyoming-kokoro
    restart: unless-stopped
    depends_on: [kokoro]
    ports:
      - "10210:10210"
    command: >
      python -m wyoming_openai
      --uri tcp://0.0.0.0:10210
      --languages en
      --tts-openai-url http://kokoro:8880/v1
      --tts-openai-key none
      --tts-models kokoro
      --tts-voices af_heart af_bella af_nicole am_michael bf_emma
      --tts-backend KOKORO_FASTAPI
      --tts-speed 1.1
